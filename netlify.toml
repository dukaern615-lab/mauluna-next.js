# Netlify configuration for MAULUNA IMMOBILIARE
# Main domain: mauluna.it

# Build settings for Next.js
[build]
  command = "npm run build"
  publish = ".next"

# Next.js plugin
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables (these will be used during build)
[build.environment]
  NEXT_PUBLIC_SUPABASE_URL = "https://mzjrywhxgqddptdxecsx.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16anJ5d2h4Z3FkZHB0ZHhlY3N4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwMTQzOTMsImV4cCI6MjA4MDU5MDM5M30.p6mvqJT1ptqnX1TDJQrJBBAV4hSovLwUpay5ZHFBKpI"
  NEXT_PUBLIC_GOOGLE_MAPS_API_KEY = "AIzaSyDP-k1W6Hlzp8RZi6x4cvjoV0Pfwqb8I4g"
  NODE_VERSION = "20.9.0"

# Domain redirects - Redirect all other domains to main domain
[[redirects]]
  from = "https://maulunaimmobiliare.com/*"
  to = "https://mauluna.it/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.maulunaimmobiliare.com/*"
  to = "https://mauluna.it/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://maulunaimmobiliare.it/*"
  to = "https://mauluna.it/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.maulunaimmobiliare.it/*"
  to = "https://mauluna.it/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.mauluna.it/*"
  to = "https://mauluna.it/:splat"
  status = 301
  force = true

# Headers for better SEO and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
