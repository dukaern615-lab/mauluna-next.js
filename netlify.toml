# Netlify configuration for MAULUNA IMMOBILIARE
# Main domain: mauluna.it

# Build settings for Next.js
[build]
  command = "npm run build"
  publish = ".next"

# Next.js plugin
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables (these will be used during build)
# Note: Secrets should be set in Netlify UI (Site settings → Environment variables)
# NOT hardcoded here for security reasons
[build.environment]
  NODE_VERSION = "20.9.0"

# Domain redirects - Redirect all other domains to main domain
[[redirects]]
  from = "https://maulunaimmobiliare.com/*"
  to = "https://mauluna.it/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.maulunaimmobiliare.com/*"
  to = "https://mauluna.it/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://maulunaimmobiliare.it/*"
  to = "https://mauluna.it/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.maulunaimmobiliare.it/*"
  to = "https://mauluna.it/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.mauluna.it/*"
  to = "https://mauluna.it/:splat"
  status = 301
  force = true

# Headers for better SEO and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
